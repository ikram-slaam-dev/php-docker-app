services:

  web:
    build:
      context: .
      dockerfile: Dockerfile

    image: php-devops-app:v1

    container_name: php-container

    ports:
      - "80:80"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health.php') === 'OK' ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s